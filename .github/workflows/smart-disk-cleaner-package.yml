name: Smart Disk Cleaner Package
# Package source is maintained in SmartDiskCleaner/; the root-level legacy files are left untouched.

on:
  workflow_dispatch:
  push:
    paths:
      - "SmartDiskCleaner/**"
      - ".github/workflows/smart-disk-cleaner-package.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate the four package files
        run: |
          set -euo pipefail
          test -s SmartDiskCleaner/SmartDiskCleaner_index.html
          test -s SmartDiskCleaner/SmartDiskCleaner_Backend.py
          test -s SmartDiskCleaner/README.md
          test -s SmartDiskCleaner/history.json
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          root = Path("SmartDiskCleaner")
          backend = (root / "SmartDiskCleaner_Backend.py").read_text()
          html = (root / "SmartDiskCleaner_index.html").read_text()
          readme = (root / "README.md").read_text()
          history = json.loads((root / "history.json").read_text())

          ast.parse(backend)
          assert isinstance(history, list), "history.json must be a JSON array"
          assert "<html" in html.lower() and "</html>" in html.lower()
          for marker in (
              "/api/system", "/api/safety", "/api/analyze",
              "/api/cleanup", "/api/verify", "/api/history"
          ):
              assert marker in backend, f"Backend route missing: {marker}"
          for marker in (
              "macStorageBreakdown", "macRunSafety", "macLoadHistory",
              "macCleanSelected", "macVerify", "macBackBtn"
          ):
              assert marker in html, f"Dashboard element missing: {marker}"
          assert "BaseHTTPRequestHandler" in backend
          assert "history.json" in readme
          assert "force-quit" in readme.lower()
          print("Python syntax, JSON, UI markers, API routes and README checks passed.")
          PY

      - name: Build and inspect exact four-file ZIP
        run: |
          set -euo pipefail
          cd SmartDiskCleaner
          zip -9 ../SmartDiskCleaner_Completion_Package.zip \
            SmartDiskCleaner_index.html \
            SmartDiskCleaner_Backend.py \
            README.md \
            history.json
          cd ..
          python - <<'PY'
          from zipfile import ZipFile
          expected = {
              "SmartDiskCleaner_index.html",
              "SmartDiskCleaner_Backend.py",
              "README.md",
              "history.json",
          }
          with ZipFile("SmartDiskCleaner_Completion_Package.zip") as archive:
              actual = set(archive.namelist())
              assert actual == expected, f"Unexpected ZIP contents: {actual}"
          print("ZIP contains exactly the four approved files.")
          PY

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartDiskCleaner-Completion-Package
          path: SmartDiskCleaner_Completion_Package.zip
          if-no-files-found: error
          retention-days: 30
